<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarPro — Автобазар Украины</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-orange-500 selection:text-white">

    <!-- Header -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="resetFilters()">
                <div class="bg-orange-600 text-white w-10 h-10 rounded-xl flex items-center justify-center font-extrabold text-xl shadow-lg shadow-orange-600/30">
                    <i class="fa-solid fa-car-side"></i>
                </div>
                <div>
                    <span class="text-2xl font-extrabold tracking-tight text-white">Car<span class="text-orange-500">Pro</span></span>
                    <span class="block text-[10px] text-slate-400 uppercase tracking-widest font-semibold">Автобазар Украины</span>
                </div>
            </div>

            <div class="flex items-center space-x-4">
                <button onclick="openFavoritesModal()" class="relative bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2.5 rounded-xl font-medium transition flex items-center space-x-2 border border-slate-700">
                    <i class="fa-solid fa-heart text-orange-500"></i>
                    <span class="hidden sm:inline">Избранное</span>
                    <span id="favorites-badge" class="bg-orange-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
                <button onclick="openAddModal()" class="bg-orange-600 hover:bg-orange-500 text-white px-5 py-2.5 rounded-xl font-bold transition shadow-lg shadow-orange-600/25 flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>Продать авто</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <!-- Sidebar Filters -->
        <aside class="lg:col-span-1 space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
                    <h2 class="text-lg font-bold flex items-center space-x-2">
                        <i class="fa-solid fa-filter text-orange-500"></i>
                        <span>Поиск авто</span>
                    </h2>
                    <button onclick="resetFilters()" class="text-xs text-slate-400 hover:text-orange-400 transition underline">Сбросить</button>
                </div>

                <div class="space-y-4">
                    <!-- Search Text -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Поиск по ключевым словам</label>
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
                            <input type="text" id="filter-search" oninput="filterCars()" placeholder="Например, S-Class, пакет M..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition text-white">
                        </div>
                    </div>

                    <!-- Brand Select -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Марка</label>
                        <select id="filter-brand" onchange="filterCars()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition text-white">
                            <option value="">Все марки</option>
                            <option value="Audi">Audi</option>
                            <option value="BMW">BMW</option>
                            <option value="Ford">Ford</option>
                            <option value="Honda">Honda</option>
                            <option value="Hyundai">Hyundai</option>
                            <option value="Kia">Kia</option>
                            <option value="Lexus">Lexus</option>
                            <option value="Mazda">Mazda</option>
                            <option value="Mercedes-Benz">Mercedes-Benz</option>
                            <option value="Nissan">Nissan</option>
                            <option value="Renault">Renault</option>
                            <option value="Skoda">Skoda</option>
                            <option value="Toyota">Toyota</option>
                            <option value="Volkswagen">Volkswagen</option>
                        </select>
                    </div>

                    <!-- Region Select -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Регион</label>
                        <select id="filter-region" onchange="filterCars()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition text-white">
                            <option value="">Вся Украина</option>
                            <option value="Киев">Киев</option>
                            <option value="Харьков">Харьков</option>
                            <option value="Одесса">Одесса</option>
                            <option value="Днепр">Днепр</option>
                            <option value="Львов">Львов</option>
                            <option value="Запорожье">Запорожье</option>
                            <option value="Винница">Винница</option>
                        </select>
                    </div>

                    <!-- Price Range -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Цена до ($)</label>
                        <input type="range" id="filter-price" min="5000" max="150000" step="5000" value="150000" oninput="filterCars(); updatePriceLabel();" class="w-full accent-orange-500 bg-slate-800 cursor-pointer">
                        <div class="flex justify-between text-xs text-slate-400 mt-1">
                            <span>$5,000</span>
                            <span id="price-label" class="text-orange-400 font-bold">$150,000+</span>
                        </div>
                    </div>

                    <!-- Fuel Type -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Тип топлива</label>
                        <select id="filter-fuel" onchange="filterCars()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition text-white">
                            <option value="">Любое</option>
                            <option value="Бензин">Бензин</option>
                            <option value="Дизель">Дизель</option>
                            <option value="Электро">Электро</option>
                            <option value="Гибрид">Гибрид</option>
                        </select>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Listings Section -->
        <section class="lg:col-span-3 space-y-6">
            <!-- Sort Bar -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col sm:flex-row items-center justify-between gap-4">
                <p class="text-sm text-slate-400"><span id="cars-count" class="text-white font-bold">0</span> объявлений найдено</p>
                <div class="flex items-center space-x-3 w-full sm:w-auto">
                    <span class="text-xs text-slate-400 uppercase font-semibold whitespace-nowrap">Сортировка:</span>
                    <select id="sort-order" onchange="filterCars()" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-orange-500 text-white w-full sm:w-auto">
                        <option value="newest">Сначала новые</option>
                        <option value="price-asc">Сначала дешевле</option>
                        <option value="price-desc">Сначала дороже</option>
                    </select>
                </div>
            </div>

            <!-- Cars Grid -->
            <div id="cars-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                <!-- Dynamic Content -->
            </div>
        </section>
    </main>

    <!-- Car Details Modal -->
    <div id="car-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4 overflow-y-auto">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-3xl w-full overflow-hidden shadow-2xl relative my-8 animate-in fade-in zoom-in duration-200">
            <button onclick="closeCarModal()" class="absolute top-4 right-4 bg-slate-800 hover:bg-slate-700 text-slate-300 w-10 h-10 rounded-full flex items-center justify-center transition z-10">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <div id="modal-content">
                <!-- Dynamically populated -->
            </div>
        </div>
    </div>

    <!-- Add Car Modal -->
    <div id="add-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4 overflow-y-auto">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-2xl relative my-8">
            <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-6">
                <h3 class="text-xl font-bold flex items-center space-x-2">
                    <i class="fa-solid fa-circle-plus text-orange-500"></i>
                    <span>Добавить объявление</span>
                </h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <form id="add-car-form" onsubmit="handleAddCar(event)" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Марка</label>
                        <select id="add-brand" onchange="updateModelsList()" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500">
                            <option value="">Выберите марку</option>
                            <option value="Audi">Audi</option>
                            <option value="BMW">BMW</option>
                            <option value="Ford">Ford</option>
                            <option value="Honda">Honda</option>
                            <option value="Hyundai">Hyundai</option>
                            <option value="Kia">Kia</option>
                            <option value="Lexus">Lexus</option>
                            <option value="Mazda">Mazda</option>
                            <option value="Mercedes-Benz">Mercedes-Benz</option>
                            <option value="Nissan">Nissan</option>
                            <option value="Renault">Renault</option>
                            <option value="Skoda">Skoda</option>
                            <option value="Toyota">Toyota</option>
                            <option value="Volkswagen">Volkswagen</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Модель</label>
                        <select id="add-model" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500">
                            <option value="">Сначала выберите марку</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Цена ($)</label>
                        <input type="number" id="add-price" required placeholder="35000" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Год</label>
                        <input type="number" id="add-year" required placeholder="2021" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Пробег (тыс. км)</label>
                        <input type="number" id="add-mileage" required placeholder="45" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Топливо</label>
                        <select id="add-fuel" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500">
                            <option value="Бензин">Бензин</option>
                            <option value="Дизель">Дизель</option>
                            <option value="Электро">Электро</option>
                            <option value="Гибрид">Гибрид</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Регион</label>
                        <select id="add-region" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500">
                            <option value="Киев">Киев</option>
                            <option value="Харьков">Харьков</option>
                            <option value="Одесса">Одесса</option>
                            <option value="Днепр">Днепр</option>
                            <option value="Львов">Львов</option>
                            <option value="Запорожье">Запорожье</option>
                            <option value="Винница">Винница</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Фотография автомобиля</label>
                    <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-slate-800 border-dashed rounded-xl bg-slate-950 hover:border-orange-500 transition cursor-pointer relative" onclick="document.getElementById('add-photo-file').click()">
                        <div class="space-y-1 text-center">
                            <i class="fa-solid fa-cloud-arrow-up text-3xl text-orange-500 mb-2"></i>
                            <div class="text-sm text-slate-300" id="file-name-display">Нажмите для выбора фото с устройства</div>
                            <p class="text-xs text-slate-500">PNG, JPG, WEBP до 5MB</p>
                        </div>
                        <input type="file" id="add-photo-file" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Телефон продавца</label>
                    <input type="text" id="add-phone" required placeholder="+38 (067) 000-00-00" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Описание</label>
                    <textarea id="add-desc" rows="3" placeholder="Состояние автомобиля, комплектация..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500"></textarea>
                </div>

                <button type="submit" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-orange-600/30">
                    Опубликовать объявление
                </button>
            </form>
        </div>
    </div>

    <!-- Favorites Drawer / Modal -->
    <div id="favorites-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4 overflow-y-auto">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl relative my-8">
            <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-6">
                <h3 class="text-xl font-bold flex items-center space-x-2">
                    <i class="fa-solid fa-heart text-orange-500"></i>
                    <span>Избранные автомобили</span>
                </h3>
                <button onclick="closeFavoritesModal()" class="text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div id="favorites-list" class="space-y-4 max-h-[60vh] overflow-y-auto pr-2">
                <!-- Dynamically populated -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 mt-auto py-8">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-slate-500">
            &copy; 2026 CarPro. Все права защищены. Ведущий украинский автобазар.
        </div>
    </footer>

            { id: 4, brand: 'Volkswagen', model: 'Passat', price: 21500, year: 2018, mileage: 135, fuel: 'Дизель', region: 'Львов', image: 'https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?auto=format&fit=crop&w=800&q=80', phone: '+38 (068) 444-55-66', desc: 'Пригнана из Европы, растаможена, без подкрасов, оригинальный пробег.' },
            { id: 5, brand: 'Toyota', model: 'Camry', price: 27800, year: 2021, mileage: 41, fuel: 'Гибрид', region: 'Днепр', image: 'https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb?auto=format&fit=crop&w=800&q=80', phone: '+38 (099) 333-22-11', desc: 'Надежный городской седан в превосходном состоянии. Расход 5л на 100км.' },
            { id: 6, brand: 'Skoda', model: 'Octavia', price: 23900, year: 2022, mileage: 29, fuel: 'Бензин', region: 'Киев', image: 'https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=800&q=80', phone: '+38 (063) 123-45-67', desc: 'Состояние нового автомобиля с салона. На гарантии.' }
        ];

        let favorites = [];
        let temporaryUploadedImage = 'https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=800&q=80';

        document.addEventListener('DOMContentLoaded', () => {
            filterCars();
        });

        function updateModelsList() {
            const brandSelect = document.getElementById('add-brand');
            const modelSelect = document.getElementById('add-model');
            const selectedBrand = brandSelect.value;

            modelSelect.innerHTML = '';

            if (!selectedBrand || !carModelsData[selectedBrand]) {
                modelSelect.innerHTML = '<option value="">Сначала выберите марку</option>';
                return;
            }

            const models = carModelsData[selectedBrand];
            modelSelect.innerHTML = '<option value="">Выберите модель</option>' + 
                models.map(model => `<option value="${model}">${model}</option>`).join('');
        }

        function updatePriceLabel() {
            const val = document.getElementById('filter-price').value;
            document.getElementById('price-label').innerText = '$' + Number(val).toLocaleString();
        }

        function filterCars() {
            const searchTxt = document.getElementById('filter-search').value.toLowerCase();
            const brandVal = document.getElementById('filter-brand').value;
            const regionVal = document.getElementById('filter-region').value;
            const priceVal = Number(document.getElementById('filter-price').value);
            const fuelVal = document.getElementById('filter-fuel').value;
            const sortVal = document.getElementById('sort-order').value;

            let filtered = cars.filter(car => {
                const fullText = `${car.brand} ${car.model} ${car.desc}`.toLowerCase();
                if (searchTxt && !fullText.includes(searchTxt)) return false;
                if (brandVal && car.brand !== brandVal) return false;
                if (regionVal && car.region !== regionVal) return false;
                if (car.price > priceVal) return false;
                if (fuelVal && car.fuel !== fuelVal) return false;
                return true;
            });

            if (sortVal === 'newest') {
                filtered.sort((a, b) => b.year - a.year);
            } else if (sortVal === 'price-asc') {
                filtered.sort((a, b) => a.price - b.price);
            } else if (sortVal === 'price-desc') {
                filtered.sort((a, b) => b.price - a.price);
            }

            renderCars(filtered);
        }

        function renderCars(list) {
            const grid = document.getElementById('cars-grid');
            document.getElementById('cars-count').innerText = list.length;

            if (list.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-16 text-center text-slate-500">
                        <i class="fa-solid fa-car-burst text-4xl mb-3 text-slate-600"></i>
                        <p class="text-base font-semibold">По вашему запросу ничего не найдено</p>
                        <p class="text-xs mt-1">Попробуйте изменить параметры фильтрации</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = list.map(car => {
                const isFav = favorites.includes(car.id);
                return `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden hover:border-slate-700 transition flex flex-col group shadow-lg">
                        <div class="relative h-48 overflow-hidden cursor-pointer" onclick="openCarModal(${car.id})">
                            <img src="${car.image}" alt="${car.brand} ${car.model}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                            <button onclick="event.stopPropagation(); toggleFavorite(${car.id})" class="absolute top-3 right-3 bg-slate-950/70 backdrop-blur-md hover:bg-slate-950 text-white w-9 h-9 rounded-xl flex items-center justify-center transition border border-slate-700">
                                <i class="fa-solid fa-heart ${isFav ? 'text-orange-500' : 'text-slate-400'}"></i>
                            </button>
                            <span class="absolute bottom-3 left-3 bg-slate-950/80 backdrop-blur-md text-orange-400 text-xs px-3 py-1.5 rounded-lg font-bold border border-slate-800">
                                ${car.region}
                            </span>
                        </div>
                        <div class="p-5 flex flex-col flex-grow">
                            <div class="flex items-start justify-between mb-2">
                                <h3 class="text-lg font-bold text-white cursor-pointer hover:text-orange-400 transition" onclick="openCarModal(${car.id})">${car.brand} ${car.model}</h3>
                                <span class="text-xl font-extrabold text-orange-500">$${car.price.toLocaleString()}</span>
                            </div>
                            <div class="grid grid-cols-3 gap-2 py-3 my-2 border-y border-slate-800/80 text-xs text-slate-400">
                                <div><i class="fa-solid fa-calendar text-orange-500 mr-1"></i> ${car.year} г.</div>
                                <div><i class="fa-solid fa-road text-orange-500 mr-1"></i> ${car.mileage} тыс. км</div>
                                <div><i class="fa-solid fa-gas-pump text-orange-500 mr-1"></i> ${car.fuel}</div>
                            </div>
                            <p class="text-xs text-slate-400 line-clamp-2 mb-4 flex-grow">${car.desc}</p>
                            <button onclick="openCarModal(${car.id})" class="w-full bg-slate-800 hover:bg-orange-600 hover:text-white text-slate-200 text-sm font-bold py-2.5 rounded-xl transition border border-slate-700 hover:border-orange-600">
                                Подробнее
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Исправленная функция чтения изображения с компьютера
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('file-name-display').innerText = `Выбрано: ${file.name}`;
                const reader = new FileReader();
                reader.onload = function(e) {
                    temporaryUploadedImage = e.target.result; // Сохраняем DataURL картинки
                };
                reader.readAsDataURL(file);
            }
        }

        function openCarModal(id) {
            const car = cars.find(c => c.id === id);
            if (!car) return;

            const modalContent = document.getElementById('modal-content');
            modalContent.innerHTML = `
                <div class="h-72 sm:h-96 relative">
                    <img src="${car.image}" alt="${car.brand} ${car.model}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent"></div>
                    <span class="absolute bottom-4 left-6 bg-orange-600 text-white text-xs px-3.5 py-1.5 rounded-lg font-bold">
                        ${car.region}
                    </span>
                </div>
                <div class="p-6 sm:p-8 space-y-6">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <h2 class="text-2xl sm:text-3xl font-extrabold text-white">${car.brand} ${car.model}</h2>
                            <p class="text-slate-400 text-sm mt-1">Украина, ${car.region}</p>
                        </div>
                        <span class="text-3xl font-extrabold text-orange-500">$${car.price.toLocaleString()}</span>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 bg-slate-950 p-4 rounded-2xl border border-slate-800 text-sm">
                        <div>
                            <span class="block text-xs text-slate-500 uppercase font-semibold">Год выпуска</span>
                            <span class="font-bold text-white">${car.year}</span>
                        </div>
                        <div>
                            <span class="block text-xs text-slate-500 uppercase font-semibold">Пробег</span>
                            <span class="font-bold text-white">${car.mileage} тыс. км</span>
                        </div>
                        <div>
                            <span class="block text-xs text-slate-500 uppercase font-semibold">Топливо</span>
                            <span class="font-bold text-white">${car.fuel}</span>
                        </div>
                        <div>
                            <span class="block text-xs text-slate-500 uppercase font-semibold">Коробка</span>
                            <span class="font-bold text-white">Автомат</span>
                        </div>
                    </div>

                    <div>
                        <h4 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Описание продавца</h4>
                        <p class="text-slate-300 text-sm leading-relaxed bg-slate-950 p-4 rounded-2xl border border-slate-800">${car.desc}</p>
                    </div>

                    <div class="flex items-center justify-between pt-4 border-t border-slate-800">
                        <div class="flex items-center space-x-3">
                            <div class="bg-orange-600/25 text-orange-400 w-12 h-12 rounded-2xl flex items-center justify-center text-xl font-bold border border-orange-500/30">
                                <i class="fa-solid fa-phone"></i>
                            </div>
                            <div>
                                <span class="block text-xs text-slate-400">Телефон владельца</span>
                                <span class="text-base font-bold text-white">${car.phone}</span>
                            </div>
                        </div>
                        <a href="tel:${car.phone}" class="bg-orange-600 hover:bg-orange-500 text-white font-bold px-6 py-3 rounded-xl transition shadow-lg shadow-orange-600/30">
                            Позвонить
                        </a>
                    </div>
                </div>
            `;

            document.getElementById('car-modal').classList.remove('hidden');
            document.getElementById('car-modal').classList.add('flex');
        }

        function closeCarModal() {
            document.getElementById('car-modal').classList.remove('flex');
            document.getElementById('car-modal').classList.add('hidden');
        }

        function openAddModal() {
            document.getElementById('add-modal').classList.remove('hidden');
            document.getElementById('add-modal').classList.add('flex');
        }

        function closeAddModal() {
            document.getElementById('add-modal').classList.remove('flex');
            document.getElementById('add-modal').classList.add('hidden');
        }

        function handleAddCar(event) {
            event.preventDefault();
            
            const newCar = {
                id: Date.now(),
                brand: document.getElementById('add-brand').value,
                model: document.getElementById('add-model').value,
                price: Number(document.getElementById('add-price').value),
                year: Number(document.getElementById('add-year').value),
                mileage: Number(document.getElementById('add-mileage').value),
                fuel: document.getElementById('add-fuel').value,
                region: document.getElementById('add-region').value,
                image: temporaryUploadedImage,
                phone: document.getElementById('add-phone').value,
                desc: document.getElementById('add-desc').value || 'Без описания.'
            };

            cars.unshift(newCar);
            filterCars();
            closeAddModal();
            document.getElementById('add-car-form').reset();
            document.getElementById('file-name-display').innerText = 'Нажмите для выбора фото с устройства';
            document.getElementById('add-model').innerHTML = '<option value="">Сначала выберите марку</option>';
            temporaryUploadedImage = 'https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=800&q=80';
        }

        function toggleFavorite(id) {
            const index = favorites.indexOf(id);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(id);
            }
            document.getElementById('favorites-badge').innerText = favorites.length;
            filterCars();
        }

        function openFavoritesModal() {
            const listContainer = document.getElementById('favorites-list');
            const favCars = cars.filter(c => favorites.includes(c.id));

            if (favCars.length === 0) {
                listContainer.innerHTML = `<p class="text-center text-slate-500 py-8 text-sm">Список избранного пуст</p>`;
            } else {
                listContainer.innerHTML = favCars.map(car => `
                    <div class="flex items-center justify-between bg-slate-950 p-3 rounded-2xl border border-slate-800">
                        <div class="flex items-center space-x-3 cursor-pointer" onclick="closeFavoritesModal(); openCarModal(${car.id})">
                            <img src="${car.image}" class="w-16 h-14 object-cover rounded-xl">
                            <div>
                                <h4 class="font-bold text-white text-sm">${car.brand} ${car.model}</h4>
                                <span class="text-xs text-orange-400 font-bold">$${car.price.toLocaleString()}</span>
                            </div>
                        </div>
                        <button onclick="toggleFavorite(${car.id})" class="text-slate-400 hover:text-red-400 p-2 transition">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `).join('');
            }

            document.getElementById('favorites-modal').classList.remove('hidden');
            document.getElementById('favorites-modal').classList.add('flex');
        }

        function closeFavoritesModal() {
            document.getElementById('favorites-modal').classList.remove('flex');
            document.getElementById('favorites-modal').classList.add('hidden');
        }

        function resetFilters() {
            document.getElementById('filter-search').value = '';
            document.getElementById('filter-brand').value = '';
            document.getElementById('filter-region').value = '';
            document.getElementById('filter-price').value = 150000;
            document.getElementById('filter-fuel').value = '';
            document.getElementById('sort-order').value = 'newest';
            updatePriceLabel();
            filterCars();
        }
    </script>
</body>
</html>
