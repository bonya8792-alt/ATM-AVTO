<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM-Авто — Автобазар Украины</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #181c24;
            --accent: #ff6600;
            --accent-hover: #e05b00;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #2a303c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: bold; color: var(--accent); text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .header-actions { display: flex; gap: 15px; align-items: center; }
        .btn { background-color: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .btn:hover { background-color: var(--accent-hover); }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; width: 100%; flex: 1; }
        .filters { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 30px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .form-control { width: 100%; padding: 10px 15px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 14px; }
        .form-control:focus { border-color: var(--accent); outline: none; }
        .cars-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .car-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s, border-color 0.2s; }
        .car-card:hover { transform: translateY(-3px); border-color: var(--accent); }
        .car-img { height: 180px; width: 100%; background-size: cover; background-position: center; background-color: #222; }
        .car-info { padding: 15px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .car-price { font-size: 20px; font-weight: bold; color: var(--accent); }
        .car-title { font-size: 16px; font-weight: 650; }
        .car-details { font-size: 13px; color: var(--text-muted); display: flex; flex-wrap: wrap; gap: 10px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 20px; overflow-y: auto; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; width: 100%; max-width: 600px; padding: 30px; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-modal { position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
        .close-modal:hover { color: var(--text-main); }
        .modal-title { font-size: 22px; font-weight: bold; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 13px; color: var(--text-muted); }
        footer { background: var(--card-bg); border-top: 1px solid var(--border-color); text-align: center; padding: 20px; color: var(--text-muted); font-size: 14px; margin-top: auto; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">🚗 ATM-Авто</a>
        <div class="header-actions">
            <span id="user-cabinet-info" style="font-size: 14px; color: var(--text-muted);"></span>
            <button class="btn" onclick="openAddModal()">+ Подать объявление</button>
        </div>
    </header>

    <div class="container">
        <div class="filters">
            <select id="filter-brand" class="form-control" onchange="filterCars()">
                <option value="">Все марки</option>
                <option value="BMW">BMW</option>
                <option value="Audi">Audi</option>
                <option value="Mercedes-Benz">Mercedes-Benz</option>
                <option value="Volkswagen">Volkswagen</option>
                <option value="Toyota">Toyota</option>
                <option value="Skoda">Skoda</option>
            </select>
            <input type="text" id="filter-search" class="form-control" placeholder="Поиск по модели..." oninput="filterCars()">
            <select id="filter-region" class="form-control" onchange="filterCars()">
                <option value="">Все регионы</option>
                <option value="Киев">Киев</option>
                <option value="Харьков">Харьков</option>
                <option value="Одесса">Одесса</option>
                <option value="Днепр">Днепр</option>
                <option value="Львов">Львов</option>
            </select>
        </div>

        <div id="cars-grid" class="cars-grid"></div>
    </div>

    <!-- Модальное окно -->
    <div id="add-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeAddModal()">&times;</button>
            <div class="modal-title">Подать объявление</div>
            <form id="add-car-form" onsubmit="handleAddCar(event)">
                <div class="form-group">
                    <label>Марка автомобиля</label>
                    <select id="add-brand" class="form-control" required onchange="updateModelsList()">
                        <option value="">Выберите марку</option>
                        <option value="BMW">BMW</option>
                        <option value="Audi">Audi</option>
                        <option value="Mercedes-Benz">Mercedes-Benz</option>
                        <option value="Volkswagen">Volkswagen</option>
                        <option value="Toyota">Toyota</option>
                        <option value="Skoda">Skoda</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Модель</label>
                    <select id="add-model" class="form-control" required>
                        <option value="">Сначала выберите марку</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Цена ($)</label>
                    <input type="number" id="add-price" class="form-control" required placeholder="Например: 15000">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>Год выпуска</label>
                        <input type="number" id="add-year" class="form-control" required placeholder="2018">
                    </div>
                    <div class="form-group">
                        <label>Пробег (тыс. км)</label>
                        <input type="number" id="add-mileage" class="form-control" required placeholder="50">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>Объем (л)</label>
                        <input type="text" id="add-engine" class="form-control" required placeholder="2.0 л">
                    </div>
                    <div class="form-group">
                        <label>КПП</label>
                        <select id="add-transmission" class="form-control">
                            <option value="Автомат">Автомат</option>
                            <option value="Механика">Механика</option>
                            <option value="Робот">Робот</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Топливо</label>
                        <select id="add-fuel" class="form-control">
                            <option value="Бензин">Бензин</option>
                            <option value="Дизель">Дизель</option>
                            <option value="Газ / Бензин">Газ / Бензин</option>
                            <option value="Электро">Электро</option>
                            <option value="Гибрид">Гибрид</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Регион</label>
                    <select id="add-region" class="form-control">
                        <option value="Киев">Киев</option>
                        <option value="Харьков">Харьков</option>
                        <option value="Одесса">Одесса</option>
                        <option value="Днепр">Днепр</option>
                        <option value="Львов">Львов</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Фотографии</label>
                    <input type="file" id="add-photos-input" class="form-control" accept="image/*" multiple onchange="handleImageSelection(event)">
                    <div id="file-name-display" style="font-size: 12px; color: var(--text-muted); margin-top: 5px;">Нажмите для выбора фото</div>
                </div>
                <div class="form-group">
                    <label>Номер телефона (для связи)</label>
                    <input type="text" id="add-phone" class="form-control" required value="+380">
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="add-desc" class="form-control" rows="3" placeholder="Состояние автомобиля..."></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%; justify-content: center; padding: 12px;">Опубликовать объявление</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 ATM-Авто. Облачная база данных Supabase подключена.</p>
    </footer>

    <script>
        // ВНИМАНИЕ: Замените SUPABASE_KEY на ваш актуальный публичный анонимный ключ (anon public) из панели Supabase!
        const SUPABASE_URL = 'https://eyvewlhxsczunmrdfcjs.supabase.co';
        const SUPABASE_KEY = 'ВАШ_АКТУАЛЬНЫЙ_ANON_KEY_ИЗ_SUPABASE';

        let allCars = [];
        let currentUserPhone = localStorage.getItem('atm_current_user') || '';
        let temporaryUploadedImages = ['https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=800&q=80'];

        const carModelsData = {
            "BMW": ["3 Series", "5 Series", "X5", "X3", "M4"],
            "Audi": ["A4", "A6", "Q7", "Q5", "TT"],
            "Mercedes-Benz": ["C-Class", "E-Class", "S-Class", "GLE", "GLK"],
            "Volkswagen": ["Golf", "Passat", "Tiguan", "Polo"],
            "Toyota": ["Camry", "RAV4", "Land Cruiser", "Corolla"],
            "Skoda": ["Octavia", "Superb", "Kodiaq", "Fabia"]
        };

        function updateModelsList() {
            const brand = document.getElementById('add-brand').value;
            const modelSelect = document.getElementById('add-model');
            modelSelect.innerHTML = '<option value="">Выберите модель</option>';
            if (carModelsData[brand]) {
                carModelsData[brand].forEach(model => {
                    modelSelect.innerHTML += `<option value="${model}">${model}</option>`;
                });
            }
        }

        function openAddModal() {
            document.getElementById('add-modal').style.display = 'flex';
            if(currentUserPhone) document.getElementById('add-phone').value = currentUserPhone;
        }

        function closeAddModal() {
            document.getElementById('add-modal').style.display = 'none';
        }

        function handleImageSelection(event) {
            const files = event.target.files;
            if (files.length > 0) {
                document.getElementById('file-name-display').innerText = `Выбрано файлов: ${files.length}`;
                temporaryUploadedImages = [];
                for (let i = 0; i < Math.min(files.length, 8); i++) {
                    temporaryUploadedImages.push(URL.createObjectURL(files[i]));
                }
            }
        }

        function updateUserCabinetUI() {
            const info = document.getElementById('user-cabinet-info');
            if (currentUserPhone) info.innerText = `Кабинет: ${currentUserPhone}`;
        }

        async function loadCarsFromSupabase() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/cars?select=*&order=created_at.desc`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                if (!response.ok) throw new Error('Ошибка авторизации или загрузки');
                allCars = await response.json();
                renderCars(allCars);
            } catch (err) {
                console.error('Не удалось загрузить из облака:', err);
            }
        }

        async function handleAddCar(event) {
            event.preventDefault();
            const phoneVal = document.getElementById('add-phone').value;
            if (!currentUserPhone) {
                currentUserPhone = phoneVal;
                localStorage.setItem('atm_current_user', currentUserPhone);
                updateUserCabinetUI();
            }

            const newCarRecord = {
                brand: document.getElementById('add-brand').value,
                model: document.getElementById('add-model').value,
                price: Number(document.getElementById('add-price').value),
                year: Number(document.getElementById('add-year').value),
                mileage: Number(document.getElementById('add-mileage').value),
                engine: document.getElementById('add-engine').value,
                transmission: document.getElementById('add-transmission').value,
                fuel: document.getElementById('add-fuel').value,
                region: document.getElementById('add-region').value,
                images: [...temporaryUploadedImages],
                phone: phoneVal,
                description: document.getElementById('add-desc').value || 'Без описания.'
            };

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/cars`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(newCarRecord)
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`Ошибка сервера: ${response.status} - ${errText}`);
                }

                closeAddModal();
                document.getElementById('add-car-form').reset();
                document.getElementById('add-phone').value = currentUserPhone || '+380';
                document.getElementById('file-name-display').innerText = 'Нажмите для выбора фото';
                document.getElementById('add-model').innerHTML = '<option value="">Сначала выберите марку</option>';
                temporaryUploadedImages = ['https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=800&q=80'];
                
                alert('Объявление успешно опубликовано в облаке!');
                loadCarsFromSupabase();
            } catch (err) {
                console.error('Ошибка сохранения:', err);
                alert('Ошибка авторизации ключа API. Проверьте SUPABASE_KEY.');
            }
        }

        function renderCars(cars) {
            const grid = document.getElementById('cars-grid');
            grid.innerHTML = '';
            if (cars.length === 0) {
                grid.innerHTML = '<div style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 40px;">Объявлений пока нет. Будьте первыми!</div>';
                return;
            }
            cars.forEach(car => {
                let imgUrl = 'https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=800&q=80';
                if (car.images) {
                    if (Array.isArray(car.images) && car.images.length > 0) imgUrl = car.images[0];
                    else if (typeof car.images === 'string' && car.images.startsWith('[')) {
                        try { const parsed = JSON.parse(car.images); if(parsed.length) imgUrl = parsed[0]; } catch(e){}
                    }
                }
                grid.innerHTML += `
                    <div class="car-card">
                        <div class="car-img" style="background-image: url('${imgUrl}')"></div>
                        <div class="car-info">
                            <div class="car-price">$${Number(car.price).toLocaleString()}</div>
                            <div class="car-title">${car.brand} ${car.model} (${car.year})</div>
                            <div class="car-details">
                                <span>${car.mileage} тыс. км</span> &bull; 
                                <span>${car.engine}</span> &bull; 
                                <span>${car.transmission}</span> &bull; 
                                <span>${car.region}</span>
                            </div>
                            <div style="font-size: 13px; color: var(--accent); margin-top: auto; padding-top: 10px; font-weight: bold;">📞 ${car.phone}</div>
                        </div>
                    </div>
                `;
            });
        }

        function filterCars() {
            const brand = document.getElementById('filter-brand').value.toLowerCase();
            const search = document.getElementById('filter-search').value.toLowerCase();
            const region = document.getElementById('filter-region').value.toLowerCase();

            const filtered = allCars.filter(car => {
                const matchBrand = !brand || (car.brand && car.brand.toLowerCase().includes(brand));
                const matchSearch = !search || (car.model && car.model.toLowerCase().includes(search)) || (car.description && car.description.toLowerCase().includes(search));
                const matchRegion = !region || (car.region && car.region.toLowerCase().includes(region));
                return matchBrand && matchSearch && matchRegion;
            });
            renderCars(filtered);
        }

        updateUserCabinetUI();
        loadCarsFromSupabase();
    </script>
</body>
</html>
