<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АТМ-Авто — Автобазар Украины</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-orange-500 selection:text-white">

    <!-- Header -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <!-- Logo -->
            <div class="flex items-center space-x-3 cursor-pointer" onclick="resetFilters()">
                <div class="bg-orange-600 text-white w-10 h-10 rounded-xl flex items-center justify-center font-extrabold text-xl shadow-lg shadow-orange-600/30">
                    <i class="fa-solid fa-car-side"></i>
                </div>
                <div>
                    <span class="text-xl sm:text-2xl font-extrabold tracking-tight text-white">АТМ-<span class="text-orange-500">Авто</span></span>
                    <span class="block text-[9px] sm:text-[10px] text-slate-400 uppercase tracking-widest font-semibold">Автобазар Украины</span>
                </div>
            </div>

            <!-- Desktop Action Buttons -->
            <div class="hidden md:flex items-center space-x-3">
                <button onclick="openFavoritesModal()" class="relative bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2.5 rounded-xl font-medium transition flex items-center space-x-2 border border-slate-700">
                    <i class="fa-solid fa-heart text-orange-500"></i>
                    <span>Избранное</span>
                    <span id="favorites-badge" class="bg-orange-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
                <div id="user-cabinet-container">
                    <!-- Заполняется динамически -->
                </div>
                <button onclick="openAddModal()" class="bg-orange-600 hover:bg-orange-500 text-white px-5 py-2.5 rounded-xl font-bold transition shadow-lg shadow-orange-600/25 flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>Продать авто</span>
                </button>
            </div>

            <!-- Mobile Menu Button -->
            <div class="flex md:hidden items-center space-x-2">
                <button onclick="openFavoritesModal()" class="relative bg-slate-800 text-slate-200 p-2.5 rounded-xl border border-slate-700">
                    <i class="fa-solid fa-heart text-orange-500 text-lg"></i>
                    <span id="favorites-badge-mobile" class="absolute -top-1 -right-1 bg-orange-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
                <button onclick="toggleMobileMenu()" class="bg-slate-800 text-slate-200 p-2.5 rounded-xl border border-slate-700">
                    <i id="mobile-menu-icon" class="fa-solid fa-bars text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Dropdown Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-slate-900 border-b border-slate-800 px-4 py-4 space-y-3">
            <div id="mobile-user-cabinet"></div>
            <button onclick="closeMobileMenu(); openAddModal();" class="w-full bg-orange-600 hover:bg-orange-500 text-white px-4 py-3 rounded-xl font-bold transition shadow-lg shadow-orange-600/25 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-plus"></i>
                <span>Продать авто</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <!-- Sidebar Filters -->
        <aside class="lg:col-span-1 space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
                    <h2 class="text-lg font-bold flex items-center space-x-2">
                        <i class="fa-solid fa-filter text-orange-500"></i>
                        <span>Поиск авто</span>
                    </h2>
                    <button onclick="resetFilters()" class="text-xs text-slate-400 hover:text-orange-400 transition underline">Сбросить</button>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Поиск по ключевым словам</label>
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
                            <input type="text" id="filter-search" oninput="filterCars()" placeholder="Например, Camry, электро..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition text-white">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Марка</label>
                        <select id="filter-brand" onchange="onFilterBrandChange()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition text-white">
                            <option value="">Все марки</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Модель</label>
                        <select id="filter-model" onchange="filterCars()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition text-white">
                            <option value="">Все модели</option>
                        </select>
                    </div>

                    <!-- Новый фильтр: Тип кузова -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Тип кузова</label>
                        <select id="filter-body" onchange="filterCars()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition text-white">
                            <option value="">Любой кузов</option>
                            <option value="Седан">Седан</option>
                            <option value="Внедорожник / Кроссовер">Внедорожник / Кроссовер</option>
                            <option value="Хэтчбек">Хэтчбек</option>
                            <option value="Универсал">Универсал</option>
                            <option value="Купе">Купе</option>
                            <option value="Минивэн">Минивэн</option>
                            <option value="Пикап">Пикап</option>
                        </select>
                    </div>

                    <!-- Новый фильтр: Привод -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Привод</label>
                        <select id="filter-drive" onchange="filterCars()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition text-white">
                            <option value="">Любой привод</option>
                            <option value="Передний">Передний</option>
                            <option value="Задний">Задний</option>
                            <option value="Полный">Полный</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Объем двигателя</label>
                        <select id="filter-engine" onchange="filterCars()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition text-white">
                            <option value="">Любой объем</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Коробка передач</label>
                        <select id="filter-transmission" onchange="filterCars()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition text-white">
                            <option value="">Любая коробка</option>
                            <option value="Механика">Механика</option>
                            <option value="Автомат">Автомат</option>
                            <option value="Робот">Робот</option>
                            <option value="Вариатор">Вариатор</option>
                            <option value="Типтроник">Типтроник</option>
                            <option value="DSG">DSG</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Регион</label>
                        <select id="filter-region" onchange="filterCars()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition text-white">
                            <option value="">Вся Украина</option>
                            <option value="Киев">Киев</option>
                            <option value="Харьков">Харьков</option>
                            <option value="Одесса">Одесса</option>
                            <option value="Днепр">Днепр</option>
                            <option value="Львов">Львов</option>
                            <option value="Запорожье">Запорожье</option>
                            <option value="Винница">Винница</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Цена до ($)</label>
                        <input type="range" id="filter-price" min="5000" max="150000" step="5000" value="150000" oninput="filterCars(); updatePriceLabel();" class="w-full accent-orange-500 bg-slate-800 cursor-pointer">
                        <div class="flex justify-between text-xs text-slate-400 mt-1">
                            <span>$100</span>
                            <span id="price-label" class="text-orange-400 font-bold">$150,000+</span>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Тип топлива</label>
                        <select id="filter-fuel" onchange="filterCars()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition text-white">
                            <option value="">Любое</option>
                            <option value="Бензин">Бензин</option>
                            <option value="Дизель">Дизель</option>
                            <option value="Газ">Газ</option>
                            <option value="Газ / Бензин">Газ / Бензин</option>
                            <option value="Электро">Электро</option>
                            <option value="Гибрид">Гибрид</option>
                        </select>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Listings Section -->
        <section class="lg:col-span-3 space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col sm:flex-row items-center justify-between gap-4">
                <p class="text-sm text-slate-400"><span id="cars-count" class="text-white font-bold">0</span> объявлений найдено</p>
                <div class="flex items-center space-x-3 w-full sm:w-auto">
                    <span class="text-xs text-slate-400 uppercase font-semibold whitespace-nowrap">Сортировка:</span>
                    <select id="sort-order" onchange="filterCars()" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-orange-500 text-white w-full sm:w-auto">
                        <option value="newest">Сначала новые</option>
                        <option value="price-asc">Сначала дешевле</option>
                        <option value="price-desc">Сначала дороже</option>
                    </select>
                </div>
            </div>

            <div id="cars-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                <!-- Dynamic Content -->
            </div>
        </section>
    </main>

    <!-- Car Details Modal -->
    <div id="car-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4 overflow-y-auto">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-3xl w-full overflow-hidden shadow-2xl relative my-8 animate-in fade-in zoom-in duration-200">
            <button onclick="closeCarModal()" class="absolute top-4 right-4 bg-slate-800 hover:bg-slate-700 text-slate-300 w-10 h-10 rounded-full flex items-center justify-center transition z-10">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <div id="modal-content">
                <!-- Dynamically populated -->
            </div>
        </div>
    </div>

    <!-- Add Car Modal -->
    <div id="add-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4 overflow-y-auto">
        <div id="add-modal-container" class="bg-slate-900 border border-slate-800 rounded-3xl max-w-xl w-full p-5 sm:p-8 shadow-2xl relative my-8 max-h-[85vh] overflow-y-auto">
            <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-6">
                <h3 class="text-xl font-bold flex items-center space-x-2">
                    <i class="fa-solid fa-circle-plus text-orange-500"></i>
                    <span>Добавить объявление</span>
                </h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-white transition p-2">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <form id="add-car-form" onsubmit="handleAddCar(event)" class="space-y-4">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Марка</label>
                        <select id="add-brand" onchange="updateModelsList('add')" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500">
                            <option value="">Выберите марку</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Модель</label>
                        <select id="add-model" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500">
                            <option value="">Сначала выберите марку</option>
                        </select>
                    </div>
                </div>

                <!-- Новые поля в форме добавления: Кузов и Привод -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Тип кузова</label>
                        <select id="add-body" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500">
                            <option value="">Выберите кузов</option>
                            <option value="Седан">Седан</option>
                            <option value="Внедорожник / Кроссовер">Внедорожник / Кроссовер</option>
                            <option value="Хэтчбек">Хэтчбек</option>
                            <option value="Универсал">Универсал</option>
                            <option value="Купе">Купе</option>
                            <option value="Минивэн">Минивэн</option>
                            <option value="Пикап">Пикап</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Привод</label>
                        <select id="add-drive" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500">
                            <option value="">Выберите привод</option>
                            <option value="Передний">Передний</option>
                            <option value="Задний">Задний</option>
                            <option value="Полный">Полный</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Цена ($)</label>
                        <input type="number" id="add-price" required placeholder="35000" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Год</label>
                        <input type="number" id="add-year" required placeholder="2021" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Пробег (тыс. км)</label>
                        <input type="number" id="add-mileage" required placeholder="45" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Объем двигателя (л)</label>
                        <select id="add-engine" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500">
                            <option value="">Выберите объем</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Коробка передач</label>
                        <select id="add-transmission" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500">
                            <option value="">Выберите коробку</option>
                            <option value="Механика">Механика</option>
                            <option value="Автомат">Автомат</option>
                            <option value="Робот">Робот</option>
                            <option value="Вариатор">Вариатор</option>
                            <option value="Типтроник">Типтроник</option>
                            <option value="DSG">DSG</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Топливо</label>
                        <select id="add-fuel" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500">
                            <option value="Бензин">Бензин</option>
                            <option value="Дизель">Дизель</option>
                            <option value="Газ">Газ</option>
                            <option value="Газ / Бензин">Газ / Бензин</option>
                            <option value="Электро">Электро</option>
                            <option value="Гибрид">Гибрид</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Регион</label>
                    <select id="add-region" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500">
                        <option value="Киев">Киев</option>
                        <option value="Харьков">Харьков</option>
                        <option value="Одесса">Одесса</option>
                        <option value="Днепр">Днепр</option>
                        <option value="Львов">Львов</option>
                        <option value="Запорожье">Запорожье</option>
                        <option value="Винница">Винница</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Фотографии автомобиля (до 8 шт.)</label>
                    <label for="add-photo-file" class="mt-1 flex flex-col items-center justify-center px-6 pt-5 pb-6 border-2 border-slate-800 border-dashed rounded-xl bg-slate-950 hover:border-orange-500 transition cursor-pointer">
                        <i class="fa-solid fa-cloud-arrow-up text-3xl text-orange-500 mb-2"></i>
                        <span class="text-sm text-slate-300 text-center" id="file-name-display">Нажмите для выбора нескольких фото (до 8)</span>
                        <span class="text-xs text-slate-500 mt-1">Автоматическое сжатие для быстрой загрузки</span>
                        <input type="file" id="add-photo-file" accept="image/*" multiple class="hidden" onchange="handleImageUpload(event)">
                    </label>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Ваш номер телефона (для входа в кабинет)</label>
                    <input type="tel" id="add-phone" required value="+380" placeholder="+380XXXXXXXXX" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500">
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Описание</label>
                        <button type="button" onclick="generateAiDescription()" class="text-xs text-orange-400 hover:text-orange-300 font-semibold flex items-center space-x-1.5 transition bg-orange-500/10 hover:bg-orange-500/20 px-2.5 py-1 rounded-lg border border-orange-500/20">
                            <i class="fa-solid fa-wand-magic-sparkles"></i>
                            <span>Сгенерировать с AI</span>
                        </button>
                    </div>
                    <textarea id="add-desc" rows="3" placeholder="Состояние автомобиля, комплектация..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500"></textarea>
                </div>

                <button type="submit" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-orange-600/30">
                    Опубликовать объявление
                </button>
            </form>
        </div>
    </div>

    <!-- Personal Cabinet Modal -->
    <div id="cabinet-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4 overflow-y-auto">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl relative my-8">
            <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-6">
                <h3 class="text-xl font-bold flex items-center space-x-2">
                    <i class="fa-solid fa-user-gear text-orange-500"></i>
                    <span>Личный кабинет (<span id="cabinet-phone-title" class="text-orange-400"></span>)</span>
                </h3>
                <button onclick="closeCabinetModal()" class="text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

        };

        const engineVolumes = [
            '0.6', '0.7', '0.8', '0.9', 
            '1.0', '1.1', '1.2', '1.3', '1.4', '1.5', '1.6', '1.7', '1.8', '1.9', 
            '2.0', '2.1', '2.2', '2.3', '2.4', '2.5', '2.6', '2.7', '2.8', '2.9', 
            '3.0', '3.2', '3.5', '3.6', '3.8', '4.0', '4.2', '4.4', '4.8', '5.0+', 
            'Электро'
        ];

        // Добавлены поля bodyType и driveType в начальные авто
        let defaultCars = [
            { id: 1, brand: 'BMW', model: 'X5', price: 48900, year: 2020, mileage: 62, engine: '3.0', bodyType: 'Внедорожник / Кроссовер', driveType: 'Полный', transmission: 'Автомат', fuel: 'Дизель', region: 'Киев', images: ['https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&w=800&q=80'], phone: '+380675553535', desc: 'Идеальное состояние, официальная машина, полная комплектация.' },
            { id: 2, brand: 'Audi', model: 'A6', price: 32000, year: 2019, mileage: 84, engine: '2.0', bodyType: 'Седан', driveType: 'Полный', transmission: 'DSG', fuel: 'Бензин', region: 'Харьков', images: ['https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?auto=format&fit=crop&w=800&q=80'], phone: '+380501112233', desc: 'Машина вложений не требует. Первый владелец.' },
            { id: 3, brand: 'Tesla', model: 'Model Y', price: 39500, year: 2022, mileage: 25, engine: 'Электро', bodyType: 'Внедорожник / Кроссовер', driveType: 'Полный', transmission: 'Автомат', fuel: 'Электро', region: 'Киев', images: ['https://images.unsplash.com/photo-1617788138017-80ad40651399?auto=format&fit=crop&w=800&q=80'], phone: '+380639991122', desc: 'Состояние нового электромобиля. Автопилот, батарея в идеале.' },
            { id: 4, brand: 'Volkswagen', model: 'Passat', price: 18500, year: 2017, mileage: 145, engine: '1.8', bodyType: 'Седан', driveType: 'Передний', transmission: 'Механика', fuel: 'Газ / Бензин', region: 'Львов', images: ['https://images.unsplash.com/photo-1541899481282-d53bffe3c485?auto=format&fit=crop&w=800&q=80'], phone: '+380974443322', desc: 'Надежный семейный седан, ухоженный салон.' }
        ];

        let cars = JSON.parse(localStorage.getItem('atm_cars')) || defaultCars;
        let favorites = JSON.parse(localStorage.getItem('atm_favorites')) || [];
        let currentUser = localStorage.getItem('atm_current_user') || null;
        let uploadedImagesBase64 = [];

        // Инициализация при загрузке страницы
        window.onload = function() {
            initBrandSelects();
            initEngineSelects();
            renderCars(cars);
            updateFavoritesUI();
            updateUserCabinetUI();
        };

        function initBrandSelects() {
            const filterBrand = document.getElementById('filter-brand');
            const addBrand = document.getElementById('add-brand');
            
            for (let brand in carModelsData) {
                filterBrand.innerHTML += `<option value="${brand}">${brand}</option>`;
                addBrand.innerHTML += `<option value="${brand}">${brand}</option>`;
            }
        }

        function initEngineSelects() {
            const filterEngine = document.getElementById('filter-engine');
            const addEngine = document.getElementById('add-engine');

            engineVolumes.forEach(vol => {
                filterEngine.innerHTML += `<option value="${vol}">${vol === 'Электро' ? 'Электро' : vol + ' л'}</option>`;
                addEngine.innerHTML += `<option value="${vol}">${vol === 'Электро' ? 'Электро' : vol + ' л'}</option>`;
            });
        }

        function onFilterBrandChange() {
            const brand = document.getElementById('filter-brand').value;
            const modelSelect = document.getElementById('filter-model');
            modelSelect.innerHTML = '<option value="">Все модели</option>';

            if (brand && carModelsData[brand]) {
                carModelsData[brand].forEach(model => {
                    modelSelect.innerHTML += `<option value="${model}">${model}</option>`;
                });
            }
            filterCars();
        }

        function updateModelsList(mode) {
            const brand = document.getElementById(`${mode}-brand`).value;
            const modelSelect = document.getElementById(`${mode}-model`);
            modelSelect.innerHTML = '<option value="">Выберите модель</option>';

            if (brand && carModelsData[brand]) {
                carModelsData[brand].forEach(model => {
                    modelSelect.innerHTML += `<option value="${model}">${model}</option>`;
                });
            }
        }

        function updatePriceLabel() {
            const val = document.getElementById('filter-price').value;
            document.getElementById('price-label').innerText = '$' + Number(val).toLocaleString();
        }

        function filterCars() {
            const search = document.getElementById('filter-search').value.toLowerCase();
            const brand = document.getElementById('filter-brand').value;
            const model = document.getElementById('filter-model').value;
            const body = document.getElementById('filter-body').value;
            const drive = document.getElementById('filter-drive').value;
            const engine = document.getElementById('filter-engine').value;
            const transmission = document.getElementById('filter-transmission').value;
            const region = document.getElementById('filter-region').value;
            const maxPrice = Number(document.getElementById('filter-price').value);
            const fuel = document.getElementById('filter-fuel').value;
            const sortOrder = document.getElementById('sort-order').value;

            let filtered = cars.filter(car => {
                const matchSearch = (car.brand + ' ' + car.model + ' ' + car.desc).toLowerCase().includes(search);
                const matchBrand = !brand || car.brand === brand;
                const matchModel = !model || car.model === model;
                const matchBody = !body || car.bodyType === body;
                const matchDrive = !drive || car.driveType === drive;
                const matchEngine = !engine || car.engine === engine;
                const matchTransmission = !transmission || car.transmission === transmission;
                const matchRegion = !region || car.region === region;
                const matchPrice = car.price <= maxPrice;
                const matchFuel = !fuel || car.fuel === fuel;

                return matchSearch && matchBrand && matchModel && matchBody && matchDrive && matchEngine && matchTransmission && matchRegion && matchPrice && matchFuel;
            });

            // Сортировка
            if (sortOrder === 'price-asc') {
                filtered.sort((a, b) => a.price - b.price);
            } else if (sortOrder === 'price-desc') {
                filtered.sort((a, b) => b.price - a.price);
            } else {
                filtered.sort((a, b) => b.id - a.id); // newest
            }

            renderCars(filtered);
        }

        function resetFilters() {
            document.getElementById('filter-search').value = '';
            document.getElementById('filter-brand').value = '';
            document.getElementById('filter-model').innerHTML = '<option value="">Все модели</option>';
            document.getElementById('filter-body').value = '';
            document.getElementById('filter-drive').value = '';
            document.getElementById('filter-engine').value = '';
            document.getElementById('filter-transmission').value = '';
            document.getElementById('filter-region').value = '';
            document.getElementById('filter-price').value = 150000;
            document.getElementById('filter-fuel').value = '';
            document.getElementById('sort-order').value = 'newest';
            updatePriceLabel();
            renderCars(cars);
        }

        function renderCars(listToRender) {
            const grid = document.getElementById('cars-grid');
            document.getElementById('cars-count').innerText = listToRender.length;

            if (listToRender.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-16 text-center bg-slate-900 border border-slate-800 rounded-2xl">
                        <i class="fa-solid fa-car text-5xl text-slate-600 mb-3"></i>
                        <h3 class="text-lg font-bold text-slate-300">Ничего не найдено</h3>
                        <p class="text-sm text-slate-500 mt-1">Попробуйте изменить параметры поиска</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = listToRender.map(car => {
                const isFav = favorites.includes(car.id);
                return `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden hover:border-slate-700 transition flex flex-col group shadow-xl">
                        <div class="relative h-48 overflow-hidden bg-slate-950 cursor-pointer" onclick="openCarModal(${car.id})">
                            <img src="${car.images[0]}" alt="${car.brand} ${car.model}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                            <div class="absolute top-3 right-3 flex items-center space-x-2">
                                <button onclick="event.stopPropagation(); toggleFavorite(${car.id})" class="bg-slate-900/80 hover:bg-slate-900 text-white w-9 h-9 rounded-full flex items-center justify-center backdrop-blur-md transition border border-slate-700">
                                    <i class="fa-solid fa-heart ${isFav ? 'text-orange-500' : 'text-slate-400'}"></i>
                                </button>
                            </div>
                            <div class="absolute bottom-3 left-3 bg-slate-950/80 backdrop-blur-md text-white font-extrabold px-3 py-1 rounded-xl text-sm border border-slate-800">
                                $${car.price.toLocaleString()}
                            </div>
                        </div>
                        <div class="p-5 flex flex-col flex-grow cursor-pointer" onclick="openCarModal(${car.id})">
                            <h3 class="text-lg font-bold text-white group-hover:text-orange-400 transition">${car.brand} ${car.model}</h3>
                            <div class="flex items-center space-x-3 text-xs text-slate-400 mt-2">
                                <span><i class="fa-solid fa-calendar mr-1 text-orange-500"></i> ${car.year} г.</span>
                                <span><i class="fa-solid fa-gauge mr-1 text-orange-500"></i> ${car.mileage} тыс. км</span>
                                <span><i class="fa-solid fa-gas-pump mr-1 text-orange-500"></i> ${car.fuel}</span>
                            </div>
                            <div class="flex items-center space-x-2 text-xs text-slate-400 mt-2 pt-2 border-t border-slate-800/60">
                                <span><i class="fa-solid fa-car-side mr-1 text-slate-500"></i> ${car.bodyType || 'Седан'}</span>
                                <span>•</span>
                                <span><i class="fa-solid fa-gears mr-1 text-slate-500"></i> ${car.driveType || 'Передний'}</span>
                            </div>
                            <div class="mt-4 pt-3 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
                                <span><i class="fa-solid fa-location-dot mr-1 text-orange-500"></i> ${car.region}</span>
                                <span class="text-orange-400 font-semibold hover:underline">Подробнее &rarr;</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleFavorite(id) {
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('atm_favorites', JSON.stringify(favorites));
            updateFavoritesUI();
            renderCars(cars);
        }

        function updateFavoritesUI() {
            document.getElementById('favorites-badge').innerText = favorites.length;
            document.getElementById('favorites-badge-mobile').innerText = favorites.length;
        }

        function openFavoritesModal() {
            const modal = document.getElementById('favorites-modal');
            const listContainer = document.getElementById('favorites-list');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            const favCars = cars.filter(c => favorites.includes(c.id));

            if (favCars.length === 0) {
                listContainer.innerHTML = `<p class="text-center text-slate-500 py-8">В избранном пока нет автомобилей</p>`;
                return;
            }

            listContainer.innerHTML = favCars.map(car => `
                <div class="flex items-center justify-between bg-slate-950 border border-slate-800 p-3 rounded-xl">
                    <div class="flex items-center space-x-3 cursor-pointer" onclick="closeFavoritesModal(); openCarModal(${car.id})">
                        <img src="${car.images[0]}" class="w-16 h-12 object-cover rounded-lg">
                        <div>
                            <h4 class="font-bold text-white text-sm">${car.brand} ${car.model} (${car.year})</h4>
                            <p class="text-xs text-orange-400 font-semibold">$${car.price.toLocaleString()}</p>
                        </div>
                    </div>
                    <button onclick="toggleFavorite(${car.id}); openFavoritesModal();" class="text-slate-400 hover:text-red-400 p-2">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            `).join('');
        }

        function closeFavoritesModal() {
            document.getElementById('favorites-modal').classList.add('hidden');
            document.getElementById('favorites-modal').classList.remove('flex');
        }

            const car = cars.find(c => c.id === id);

                    <!-- Характеристики -->

                            <span class="text-slate-500 block">Пробег</span>
                            <span class="font-bold text-white text-sm">${car.mileage} тыс. км</span>
                        </div>
                        <div>
                            <span class="text-slate-500 block">Двигатель</span>
                            <span class="font-bold text-white text-sm">${car.engine === 'Электро' ? 'Электро' : car.engine + ' л'} (${car.fuel})</span>

                            <span class="text-slate-500 block">Тип кузова</span>
                            <span class="font-bold text-white text-sm">${car.bodyType || 'Седан'}</span>
                        </div>

                            <span class="text-slate-500 block">Привод</span>
                            <span class="font-bold text-white text-sm">${car.driveType || 'Передний'}</span>
                        </div>
                    </div>

                    <!-- Описание -->
                    <div>
                        <h4 class="text-xs uppercase font-bold text-slate-400 mb-2">Описание продавца</h4>
                        <p class="text-sm text-slate-300 bg-slate-950 p-4 rounded-2xl border border-slate-800 leading-relaxed">${car.desc || 'Описание отсутствует.'}</p>
                    </div>

                    <!-- Контактный блок -->
                    <div class="bg-orange-600/10 border border-orange-500/20 p-4 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-4">
                        <div>
                            <span class="text-xs text-orange-400 uppercase font-bold block">Телефон владельца</span>
                            <span class="text-lg font-bold text-white">${car.phone}</span>
                        </div>
                        <a href="tel:${car.phone}" class="w-full sm:w-auto bg-orange-600 hover:bg-orange-500 text-white font-bold px-6 py-3 rounded-xl transition shadow-lg shadow-orange-600/30 text-center">
                            Позвонить продавцу
                        </a>
                    </div>
                </div>
            `;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeCarModal() {
            document.getElementById('car-modal').classList.add('hidden');
            document.getElementById('car-modal').classList.remove('flex');
        }

        function openAddModal() {
            document.getElementById('add-modal').classList.remove('hidden');
            document.getElementById('add-modal').classList.add('flex');
        }

        function closeAddModal() {
            document.getElementById('add-modal').classList.add('hidden');
            document.getElementById('add-modal').classList.remove('flex');
        }

        function handleImageUpload(event) {
            const files = event.target.files;
            if (!files.length) return;

            uploadedImagesBase64 = [];
            const display = document.getElementById('file-name-display');
            display.innerText = `Загружено файлов: ${Math.min(files.length, 8)}`;

            let count = Math.min(files.length, 8);
            for (let i = 0; i < count; i++) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImagesBase64.push(e.target.result);
                }
                reader.readAsDataURL(files[i]);
            }
        }

        function generateAiDescription() {
            const brand = document.getElementById('add-brand').value;
            const model = document.getElementById('add-model').value;
            const year = document.getElementById('add-year').value;
            const mileage = document.getElementById('add-mileage').value;
            const fuel = document.getElementById('add-fuel').value;
            const body = document.getElementById('add-body').value;
            const drive = document.getElementById('add-drive').value;

            if (!brand || !model) {
                alert('Пожалуйста, выберите марку и модель автомобиля для генерации AI-описания.');
                return;
            }

            const templates = [
                toAiString(`Продается отличный ${brand} ${model} ${year} года выпуска в кузове (${body || 'седан'}). Автомобиль в прекрасном техническом состоянии, обслуживался вовремя. Привод — ${drive || 'передний'}, топливо — ${fuel}. Пробег честный, салон ухоженный и чистый. Готов к проверкам на любом СТО. Торг у капота!`),
                toAiString(`Вашему вниманию предлагается ${brand} ${model} (${year} г.в.). ${body || 'Кузов'} в родной краске, ${drive || 'полный'} привод обеспечивает уверенность на любой дороге. Динамичный, комфортный и надежный автомобиль. Все расходники заменены, вложений не требует. Звоните!`)
            ];

            document.getElementById('add-desc').value = templates[Math.floor(Math.random() * templates.length)];
        }

        function toAiString(str) { return str; }

        function handleAddCar(event) {
            event.preventDefault();

            const brand = document.getElementById('add-brand').value;
            const model = document.getElementById('add-model').value;
            const bodyType = document.getElementById('add-body').value;
            const driveType = document.getElementById('add-drive').value;
            const price = Number(document.getElementById('add-price').value);
            const year = Number(document.getElementById('add-year').value);
            const mileage = Number(document.getElementById('add-mileage').value);
            const engine = document.getElementById('add-engine').value;
            const transmission = document.getElementById('add-transmission').value;
            const fuel = document.getElementById('add-fuel').value;
            const region = document.getElementById('add-region').value;
            const phone = document.getElementById('add-phone').value;
            const desc = document.getElementById('add-desc').value;

            const images = uploadedImagesBase64.length > 0 ? uploadedImagesBase64 : ['https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=800&q=80'];

            const newCar = {
                id: Date.now(),
                brand, model, bodyType, driveType, price, year, mileage, engine, transmission, fuel, region, phone, desc, images
            };

            cars.unshift(newCar);
            localStorage.setItem('atm_cars', JSON.stringify(cars));

            // Автоматический вход под этим телефоном при добавлении объявления
            currentUser = phone;
            localStorage.setItem('atm_current_user', currentUser);

            closeAddModal();
            document.getElementById('add-car-form').reset();
            uploadedImagesBase64 = [];
            document.getElementById('file-name-display').innerText = 'Нажмите для выбора нескольких фото (до 8)';

            renderCars(cars);
            updateUserCabinetUI();
            alert('Объявление успешно опубликовано!');
        }

        function updateUserCabinetUI() {
            const container = document.getElementById('user-cabinet-container');
            const mobileContainer = document.getElementById('mobile-user-cabinet');

            if (currentUser) {
                const btnHTML = `
                    <button onclick="openCabinetModal()" class="bg-slate-800 hover:bg-slate-700 text-orange-400 px-4 py-2.5 rounded-xl font-medium transition flex items-center space-x-2 border border-slate-700">
                        <i class="fa-solid fa-user-shield"></i>
                        <span>Кабинет</span>
                    </button>
                `;
                container.innerHTML = btnHTML;
                mobileContainer.innerHTML = `
                    <button onclick="openCabinetModal()" class="w-full bg-slate-800 text-orange-400 px-4 py-3 rounded-xl font-bold transition flex items-center justify-center space-x-2 border border-slate-700">
                        <i class="fa-solid fa-user-shield"></i>
                        <span>Личный кабинет (${currentUser})</span>
                    </button>
                `;
            } else {
                const btnHTML = `
                    <button onclick="openAuthModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2.5 rounded-xl font-medium transition flex items-center space-x-2 border border-slate-700">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        <span>Вход</span>
                    </button>
                `;
                container.innerHTML = btnHTML;
                mobileContainer.innerHTML = `
                    <button onclick="openAuthModal()" class="w-full bg-slate-800 text-slate-200 px-4 py-3 rounded-xl font-bold transition flex items-center justify-center space-x-2 border border-slate-700">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        <span>Войти в личный кабинет</span>
                    </button>
                `;
            }
        }

        function openAuthModal() {
            document.getElementById('auth-modal').classList.remove('hidden');
            document.getElementById('auth-modal').classList.add('flex');
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').classList.add('hidden');
            document.getElementById('auth-modal').classList.remove('flex');
        }

        function handleLogin(event) {
            event.preventDefault();
            const phone = document.getElementById('login-phone').value;
            currentUser = phone;
            localStorage.setItem('atm_current_user', currentUser);
            closeAuthModal();
            updateUserCabinetUI();
            alert(`Вы успешно вошли как ${phone}`);
        }

        function logoutUser() {
            currentUser = null;
            localStorage.removeItem('atm_current_user');
            closeCabinetModal();
            updateUserCabinetUI();
            alert('Вы вышли из личного кабинета');
        }

        function openCabinetModal() {
            if (!currentUser) {
                openAuthModal();
                return;
            }

            const modal = document.getElementById('cabinet-modal');
            document.getElementById('cabinet-phone-title').innerText = currentUser;
            const listContainer = document.getElementById('cabinet-cars-list');

            const myCars = cars.filter(c => c.phone === currentUser);

            if (myCars.length === 0) {
                listContainer.innerHTML = `<p class="text-center text-slate-500 py-8">У вас пока нет активных объявлений</p>`;
            } else {
                listContainer.innerHTML = myCars.map(car => `
                    <div class="flex items-center justify-between bg-slate-950 border border-slate-800 p-3 rounded-xl">
                        <div class="flex items-center space-x-3 cursor-pointer" onclick="closeCabinetModal(); openCarModal(${car.id})">
                            <img src="${car.images[0]}" class="w-16 h-12 object-cover rounded-lg">
                            <div>
                                <h4 class="font-bold text-white text-sm">${car.brand} ${car.model} (${car.year})</h4>
                                <p class="text-xs text-orange-400 font-semibold">$${car.price.toLocaleString()} • ${car.region}</p>
                            </div>
                        </div>
                        <button onclick="deleteMyCar(${car.id})" class="text-slate-400 hover:text-red-400 p-2" title="Удалить объявление">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `).join('');
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeCabinetModal() {
            document.getElementById('cabinet-modal').classList.add('hidden');
            document.getElementById('cabinet-modal').classList.remove('flex');
        }

        function deleteMyCar(id) {
            if (confirm('Вы действительно хотите удалить это объявление?')) {
                cars = cars.filter(c => c.id !== id);
                localStorage.setItem('atm_cars', JSON.stringify(cars));
                renderCars(cars);
                openCabinetModal();
            }
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            const icon = document.getElementById('mobile-menu-icon');
            menu.classList.toggle('hidden');
            icon.classList.toggle('fa-bars');
            icon.classList.toggle('fa-xmark');
        }

        function closeMobileMenu() {
            document.getElementById('mobile-menu').classList.add('hidden');
            const icon = document.getElementById('mobile-menu-icon');
            icon.classList.add('fa-bars');
            icon.classList.remove('fa-xmark');
        }
    </script>
</body>
</html>
